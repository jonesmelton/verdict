name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: read-all

jobs:
  build:
    name: Build and test (OCaml ${{ matrix.ocaml-compiler }})

    runs-on: ubuntu-latest

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler:
          - "5.2"
          - "5.5"

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build @all

      - name: Run tests
        run: opam exec -- dune runtest

  lint-fmt:
    name: Lint fmt

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      - name: Lint fmt
        uses: ocaml/setup-ocaml/lint-fmt@v3

  lint-doc:
    name: Lint doc

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      - name: Lint doc
        uses: ocaml/setup-ocaml/lint-doc@v3

  lint-opam:
    name: Lint opam

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      - name: Lint opam
        run: opam lint
